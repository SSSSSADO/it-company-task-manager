{% extends "base.html" %}

{% block title %}<title>{% if object %}Edit{% else %}New{% endif %} Task Type — TaskOS</title>{% endblock %}

{% block content %}
  <div class="page-header">
    <h1 class="page-title">{% if object %}✎ Edit Task Type{% else %}+ New Task Type{% endif %}</h1>
  </div>

  <form action="" method="post" style="max-width:480px;">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="btn-group" style="margin-top:8px;">
      <input type="submit" value="{% if object %}Save Changes{% else %}Create Type{% endif %}">
      <a href="{% url 'manager:task-type-list' %}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
{% endblock %}
