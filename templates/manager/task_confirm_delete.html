{% extends "base.html" %}

{% block title %}<title>Delete Task — TaskOS</title>{% endblock %}

{% block content %}
  <div class="page-header">
    <h1 class="page-title">Delete Task</h1>
  </div>

  <div class="danger-zone">
    <h3 style="color:var(--danger); margin-bottom:10px;">⚠ Are you sure?</h3>
    <p>You are about to permanently delete <strong style="color:var(--text-primary);">{{ task.name }}</strong>. This action cannot be undone.</p>
    <form action="" method="post">
      {% csrf_token %}
      <div class="btn-group">
        <button type="submit" class="btn btn-danger">Delete Task</button>
        <a href="{% url 'manager:task-list' %}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
