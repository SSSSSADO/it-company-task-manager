{% extends "base.html" %}

{% block title %}<title>Delete Task Type — TaskOS</title>{% endblock %}

{% block content %}
  <div class="page-header">
    <h1 class="page-title">Delete Task Type</h1>
  </div>

  <div class="danger-zone">
    <h3 style="color:var(--danger); margin-bottom:10px;">⚠ Are you sure?</h3>
    <p>You are about to permanently delete the task type <strong style="color:var(--text-primary);">{{ task_type.name }}</strong>. All tasks of this type will also be deleted.</p>
    <form method="post">
      {% csrf_token %}
      <div class="btn-group">
        <button type="submit" class="btn btn-danger">Delete Task Type</button>
        <a href="{% url 'manager:task-type-list' %}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
